server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.CockroachDialect
  flyway:
    enabled: true
app:
  jwt-secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_API_KEY}
  admin-email: ${ADMIN_EMAIL:}
  admin-login-id: ${ADMIN_LOGIN_ID:ECOM-ADMIN}
  admin-password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
